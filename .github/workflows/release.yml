name: Build installers

# Tauri cannot cross-compile: each installer has to be made on the system it targets,
# because each links against that system's webview and toolchain. So one job per platform,
# on GitHub's own runners, rather than a build machine per operating system.
#
# Triggered by hand, or by pushing a version tag. It does not run on every commit: a full
# release build compiles llama.cpp from scratch and takes tens of minutes.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      # One platform failing should not throw away the installers the others produced.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS (Apple silicon)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      # 22.04 rather than the newest Ubuntu: Tauri 2 needs webkit2gtk 4.1, and the runner
      # images past this one have moved on in ways that break it.
      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The Rust build is the slow half by a wide margin, llama.cpp most of it.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        # Not through scripts/tauri.sh: that wrapper exists to sign dev builds so the
        # keychain stops asking, and a release bundle is signed by Tauri itself.
        #
        # The Google credentials are compiled in from here rather than from the source, which
        # is why the repository can be public. Add them under Settings, Secrets and variables,
        # Actions; without them the app builds and says it has no credentials.
        env:
          LUMEN_GOOGLE_CLIENT_ID: ${{ secrets.LUMEN_GOOGLE_CLIENT_ID }}
          LUMEN_GOOGLE_CLIENT_SECRET: ${{ secrets.LUMEN_GOOGLE_CLIENT_SECRET }}
        run: pnpm exec tauri build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v6
        with:
          name: lumen-${{ matrix.target }}
          # Everything the bundler produced: .dmg and .app, .deb and .AppImage, .msi and
          # .exe, depending on the platform.
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error

  # Artifacts need a GitHub login to download, so they are no use for handing a build to
  # someone outside the repository. A release is public: a plain link, no account, no zip.
  # Gmail refuses .exe attachments even inside an archive, so a link is the only way to send
  # an installer by mail at all.
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts

      # Flattened, because the installers arrive nested under each platform's bundle
      # folders and a release page wants files, not a tree.
      - name: Collect the installers
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
               -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} release/ \;
          ls -lh release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          generate_release_notes: true
